<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Painel de Clientes</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
<style>
:root{--bg:#f8f9fb;--card:#fff;--tx:#111827;--mu:#6b7280;--bd:#e5e7eb;--pri:#4f46e5;--soft:#eef2ff;--rd:#dc2626;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1115;--card:#1a1d23;--tx:#f3f4f6;--mu:#9ca3af;--bd:#2c313a;--pri:#818cf8;--soft:#23263a;--rd:#f87171}}
:root[data-theme="dark"]{--bg:#0f1115;--card:#1a1d23;--tx:#f3f4f6;--mu:#9ca3af;--bd:#2c313a;--pri:#818cf8;--soft:#23263a;--rd:#f87171}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font:14px/1.5 Inter,system-ui,sans-serif}
.wrap{max-width:1000px;margin:auto;padding:24px 16px 48px}
.bar{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:36px}
h1{margin:0;font-size:24px;font-weight:700}
.seg{display:inline-flex;border:1px solid var(--bd);background:var(--card);border-radius:10px;padding:3px;gap:2px;align-items:center}
.seg small{font-size:10px;font-weight:600;letter-spacing:.06em;color:var(--mu);padding:0 8px}
.seg button{border:0;background:none;color:var(--mu);font:inherit;font-weight:600;font-size:12px;padding:6px 12px;border-radius:7px;cursor:pointer}
.seg button.on{background:var(--soft);color:var(--pri)}
.cnt{border:1px solid var(--bd);background:var(--card);border-radius:99px;padding:6px 14px;font-size:11px;font-weight:600;color:var(--mu);letter-spacing:.06em}
.cnt b{color:var(--pri);font-size:13px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,260px));gap:56px 20px}
.cl{position:relative;background:var(--card);border:1px solid var(--bd);border-left:4px solid var(--c,#8a3b12);border-radius:12px;padding:46px 14px 14px;text-align:center;box-shadow:0 1px 3px rgba(0,0,0,.05);margin-top:34px}
.av{position:absolute;top:-38px;left:50%;transform:translateX(-50%);width:76px;height:76px;border-radius:50%;border:4px solid var(--card);box-shadow:0 1px 4px rgba(0,0,0,.2);overflow:hidden;background:var(--c,#8a3b12);color:#fff;font-weight:700;font-size:26px;display:flex;align-items:center;justify-content:center}
.av img{width:100%;height:100%;object-fit:cover}
.ic{position:absolute;top:8px;right:8px;display:flex;gap:4px}
.ic button{width:28px;height:28px;border:0;border-radius:7px;background:var(--bg);color:var(--tx);cursor:pointer;font-size:13px}
.cl h3{margin:6px 0 4px;font-size:15px;font-weight:600}
.ig{display:inline-block;font-size:11px;color:var(--mu);background:var(--bg);border-radius:99px;padding:2px 10px}
.lab{margin:16px 0 8px;font-size:10px;font-weight:600;letter-spacing:.08em;color:var(--mu)}
.row{display:flex;gap:8px}
.btn{flex:1;display:inline-block;text-align:center;border:0;border-radius:8px;padding:8px 6px;font:inherit;font-size:12px;font-weight:600;cursor:pointer;background:var(--bg);color:var(--tx);text-decoration:none}
.btn.p{background:var(--pri);color:#fff}.btn[aria-disabled=true]{opacity:.45;pointer-events:none}
.add{margin-top:34px;border:2px dashed var(--bd);border-radius:12px;background:none;color:var(--mu);font:inherit;font-weight:600;cursor:pointer;min-height:150px}
.empty{color:var(--mu);padding:30px 0}
.prof{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:20px;max-width:520px;display:grid;gap:10px}
.prof .av{position:static;transform:none;margin:0 auto 4px}
label{font-size:12px;font-weight:600;color:var(--mu);display:grid;gap:4px}
input,textarea{font:inherit;color:var(--tx);background:var(--bg);border:1px solid var(--bd);border-radius:8px;padding:8px 10px;width:100%}
input[type=color]{padding:2px;height:36px}textarea{min-height:70px;resize:vertical}
#modal{position:fixed;inset:0;background:rgba(0,0,0,.45);display:none;align-items:center;justify-content:center;padding:16px;z-index:9}
#modal.on{display:flex}
.mb{background:var(--card);border-radius:14px;padding:20px;width:100%;max-width:420px;display:grid;gap:10px;max-height:92vh;overflow:auto}
.mb h2{margin:0 0 4px;font-size:17px}
.ok{color:var(--mu);font-size:12px;text-align:center}
</style>
</head>
<body>
<div class="wrap">
  <div class="bar">
    <h1 id="ttl">Clientes</h1>
    <div class="seg" id="nav"></div>
    <div class="cnt" id="cnt"></div>
  </div>
  <div id="view"></div>
</div>
<div id="modal"><div class="mb" id="mb"></div></div>
<script>
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let db,assets,user,owner=false,clients=[],profile={},tab='clientes',status='ativos';

async function init(){
  render();
  try{
    user=await claude.use("user");db=await claude.use("db");assets=await claude.use("assets");
    owner=user?.isOwner?.()??false;
    if(!db){$('#view').innerHTML='<div class="empty">Entre na sua conta Claude para ver o painel.</div>';return}
    db.collection("clients").onSnapshot(s=>{clients=s.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>(a.createdAt||0)-(b.createdAt||0));render()});
    db.collection("config").doc("profile").onSnapshot(s=>{profile=s.exists?s.data():{};render()});
  }catch(e){console.error(e)}
}
const av=(id,name,color)=>id?`<img src="/_blob/${esc(id)}" alt="">`:esc((name||'?').trim().charAt(0).toUpperCase());

function render(){
  const act=clients.filter(c=>c.active!==false),ina=clients.filter(c=>c.active===false);
  $('#ttl').textContent=tab==='clientes'?'Clientes':'Meu perfil';
  $('#nav').innerHTML=`<small>${tab==='clientes'?'STATUS':'ÁREA'}</small>`+
    (tab==='clientes'?`<button class="${status==='ativos'?'on':''}" data-s="ativos">Ativos (${act.length})</button><button class="${status==='inativos'?'on':''}" data-s="inativos">Inativos (${ina.length})</button>`:'')+
    `<button class="${tab==='perfil'?'on':''}" data-t="${tab==='perfil'?'clientes':'perfil'}">${tab==='perfil'?'← Clientes':'👤 Meu perfil'}</button>`;
  $('#nav').querySelectorAll('[data-s]').forEach(b=>b.onclick=()=>{status=b.dataset.s;render()});
  $('#nav').querySelectorAll('[data-t]').forEach(b=>b.onclick=()=>{tab=b.dataset.t;render()});
  $('#cnt').innerHTML=`ATIVOS <b>${act.length}</b>`;
  tab==='perfil'?viewProfile():viewClients(status==='ativos'?act:ina);
}

function viewClients(list){
  const cards=list.map(c=>{
    const ig=c.instagram?'@'+esc(c.instagram.replace(/^@/,'')):'desconectado';
    const tools=owner?`<div class="ic"><button data-edit="${c.id}" title="Editar">✎</button>${c.active===false?`<button data-restore="${c.id}" title="Restaurar">↩</button><button data-del="${c.id}" title="Excluir">🗑</button>`:`<button data-off="${c.id}" title="Mover para inativos">🗑</button>`}</div>`:'';
    const open=c.link?`<a class="btn" href="${esc(c.link)}" target="_blank" rel="noopener">Abrir aprovação</a>`:`<span class="btn" aria-disabled="true">Sem link</span>`;
    const cp=c.link?`<button class="btn p" data-copy="${c.id}">Copiar link</button>`:'';
    return `<div class="cl" style="--c:${esc(c.color||'#8a3b12')}"><div class="av">${av(c.logoId,c.name)}</div>${tools}<h3>${esc(c.name)}</h3><span class="ig">◎ ${ig}</span><div class="lab">APROVAÇÃO DE POSTS</div><div class="row">${open}${cp}</div></div>`;
  }).join('');
  const add=owner&&status==='ativos'?`<button class="add" id="add">+ Novo cliente</button>`:'';
  $('#view').innerHTML=(cards||add)?`<div class="grid">${cards}${add}</div>`:'<div class="empty">Nenhum cliente por aqui.</div>';
  if($('#add'))$('#add').onclick=()=>modal();
  const get=id=>clients.find(c=>c.id===id);
  document.querySelectorAll('[data-edit]').forEach(b=>b.onclick=()=>modal(get(b.dataset.edit)));
  document.querySelectorAll('[data-off]').forEach(b=>b.onclick=()=>db.collection("clients").doc(b.dataset.off).update({active:false}));
  document.querySelectorAll('[data-restore]').forEach(b=>b.onclick=()=>db.collection("clients").doc(b.dataset.restore).update({active:true}));
  document.querySelectorAll('[data-del]').forEach(b=>b.onclick=()=>{if(confirm('Excluir este cliente de vez?'))db.collection("clients").doc(b.dataset.del).delete()});
  document.querySelectorAll('[data-copy]').forEach(b=>b.onclick=async()=>{
    const l=get(b.dataset.copy).link;
    try{await navigator.clipboard.writeText(l)}catch(e){const t=document.createElement('textarea');t.value=l;document.body.append(t);t.select();document.execCommand('copy');t.remove()}
    b.textContent='Copiado ✓';setTimeout(()=>b.textContent='Copiar link',1800)});
}

function modal(c){
  const n=!c;c=c||{};
  $('#mb').innerHTML=`<h2>${n?'Novo cliente':'Editar cliente'}</h2>
  <label>Nome<input id="m-name" value="${esc(c.name)}"></label>
  <label>Instagram (sem @)<input id="m-ig" value="${esc(c.instagram)}"></label>
  <label>Link da página de aprovação<input id="m-link" value="${esc(c.link)}" placeholder="https://claude.ai/artifact/…"></label>
  ${assets?'<label>Logo<input type="file" id="m-logo" accept="image/*"></label>':''}
  <label>Cor do cliente<input type="color" id="m-color" value="${esc(c.color||'#8a3b12')}"></label>
  <div class="row"><button class="btn" id="m-x">Cancelar</button><button class="btn p" id="m-ok">Salvar</button></div>`;
  $('#modal').classList.add('on');
  $('#m-x').onclick=()=>$('#modal').classList.remove('on');
  $('#m-ok').onclick=async()=>{
    const name=$('#m-name').value.trim();if(!name)return;
    const b=$('#m-ok');b.textContent='Salvando…';
    try{
      let logoId=c.logoId||'';const f=$('#m-logo')?.files[0];
      if(f)logoId=(await assets.upload(f)).id;
      await db.collection("clients").doc(c.id||'c'+Date.now()).set({name,instagram:$('#m-ig').value.trim(),link:$('#m-link').value.trim(),color:$('#m-color').value,logoId,active:c.active!==false,createdAt:c.createdAt||Date.now()});
      $('#modal').classList.remove('on');
    }catch(e){alert('Não foi possível salvar: '+(e.message||e.code));b.textContent='Salvar'}
  };
}

function viewProfile(){
  const p=profile,ro=owner?'':'disabled';
  $('#view').innerHTML=`<div class="prof"><div class="av" style="--c:#4f46e5">${av(p.avatarId,p.name||'Eu')}</div>
  ${owner&&assets?'<label>Foto<input type="file" id="p-av" accept="image/*"></label>':''}
  <label>Nome<input id="p-name" ${ro} value="${esc(p.name)}"></label>
  <label>Função<input id="p-role" ${ro} value="${esc(p.role||'Social Media Freelancer')}"></label>
  <label>E-mail<input id="p-mail" ${ro} value="${esc(p.email)}"></label>
  <label>WhatsApp<input id="p-wpp" ${ro} value="${esc(p.whatsapp)}"></label>
  <label>Instagram (sem @)<input id="p-ig" ${ro} value="${esc(p.instagram)}"></label>
  <label>Sobre mim<textarea id="p-bio" ${ro}>${esc(p.bio)}</textarea></label>
  ${owner?'<button class="btn p" id="p-ok" style="flex:none">Salvar perfil</button>':''}</div>`;
  if(!owner)return;
  $('#p-ok').onclick=async()=>{
    const b=$('#p-ok');b.textContent='Salvando…';
    try{
      let avatarId=p.avatarId||'';const f=$('#p-av')?.files[0];
      if(f)avatarId=(await assets.upload(f)).id;
      await db.collection("config").doc("profile").set({name:$('#p-name').value.trim(),role:$('#p-role').value.trim(),email:$('#p-mail').value.trim(),whatsapp:$('#p-wpp').value.trim(),instagram:$('#p-ig').value.trim(),bio:$('#p-bio').value.trim(),avatarId});
      b.textContent='Salvo ✓';setTimeout(()=>b.textContent='Salvar perfil',1800);
    }catch(e){alert('Não foi possível salvar: '+(e.message||e.code));b.textContent='Salvar perfil'}
  };
}
init();
</script>
</body>
</html>
